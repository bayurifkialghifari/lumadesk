name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check application and tag versions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.GITHUB_REF_NAME;
          const refType = process.env.GITHUB_REF_TYPE;
          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(
            readFileSync("src-tauri/tauri.conf.json", "utf8"),
          ).version;
          const cargoManifest = readFileSync("Cargo.toml", "utf8");
          const cargoVersion = cargoManifest.match(
            /\[workspace\.package\][\s\S]*?^version = "([^"]+)"/m,
          )?.[1];

          if (tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            throw new Error(
              `Application versions do not match: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}.`,
            );
          }

          if (refType === "tag") {
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error(`Tag ${tag} must use the vMAJOR.MINOR.PATCH format.`);
            }

            const expectedTag = `v${packageVersion}`;
            if (tag !== expectedTag) {
              throw new Error(`Tag ${tag} must match the application version ${expectedTag}.`);
            }
          }
          NODE

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: verify-version
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_name: linux-x86_64
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm
            artifact_paths: |
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          - platform: ubuntu-22.04-arm
            artifact_name: linux-aarch64
            rust_targets: aarch64-unknown-linux-gnu
            tauri_args: --target aarch64-unknown-linux-gnu --bundles appimage,deb,rpm
            artifact_paths: |
              target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          - platform: macos-latest
            artifact_name: macos-aarch64
            rust_targets: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles dmg
            artifact_paths: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-latest
            artifact_name: macos-x86_64
            rust_targets: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles dmg
            artifact_paths: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            artifact_name: windows-x86_64
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis
            artifact_paths: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - platform: windows-latest
            artifact_name: windows-aarch64
            rust_targets: aarch64-pc-windows-msvc
            tauri_args: --target aarch64-pc-windows-msvc --bundles nsis
            artifact_paths: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact_name }}
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.tauri_args }}

      - name: Store desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download desktop bundles
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release files and checksums
        run: |
          set -euo pipefail
          mkdir release-files

          while IFS= read -r -d '' asset; do
            destination="release-files/$(basename "$asset")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release filename: $destination" >&2
              exit 1
            fi
            cp "$asset" "$destination"
          done < <(find release-assets -type f -print0)

          if ! find release-files -type f -print -quit | grep -q .; then
            echo "No release files were downloaded." >&2
            exit 1
          fi

          (
            cd release-files
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-files -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --generate-notes \
            --title "LumaDesk ${GITHUB_REF_NAME#v}" \
            --verify-tag
