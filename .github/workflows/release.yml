name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAURI_RELEASE_ARGS: ""

jobs:
  verify-release:
    name: Verify release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check versions and signing groups
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const present = (name) => (process.env[name] ?? "").trim().length > 0;
          const requireAll = (names, label) => {
            const configured = names.filter(present);
            if (configured.length !== names.length) {
              throw new Error(label + " requires " + names.join(", ") + ".");
            }
          };
          const requireAllOrNone = (names, label) => {
            const configured = names.filter(present);
            if (configured.length > 0 && configured.length !== names.length) {
              throw new Error(label + " must configure all of " + names.join(", ") + " or none of them.");
            }
            return configured.length === names.length;
          };

          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(
            readFileSync("src-tauri/tauri.conf.json", "utf8"),
          ).version;
          const cargoManifest = readFileSync("Cargo.toml", "utf8");
          const cargoVersion = cargoManifest.match(
            /\[workspace\.package\][\s\S]*?^version = "([^"]+)"/m,
          )?.[1];

          if (tauriVersion !== packageVersion || cargoVersion !== packageVersion) {
            throw new Error(
              "Application versions do not match: package=" + packageVersion +
                ", tauri=" + tauriVersion + ", cargo=" + cargoVersion + ".",
            );
          }

          const refName = process.env.GITHUB_REF_NAME ?? "";
          if (process.env.GITHUB_REF_TYPE === "tag") {
            if (!/^v\d+\.\d+\.\d+$/.test(refName)) {
              throw new Error("Tag " + refName + " must use vMAJOR.MINOR.PATCH.");
            }
            if (refName !== "v" + packageVersion) {
              throw new Error(
                "Tag " + refName + " must match application version v" + packageVersion + ".",
              );
            }
          } else if (
            process.env.GITHUB_EVENT_NAME !== "workflow_dispatch" ||
            refName !== "main"
          ) {
            throw new Error("Manual release validation must run from main.");
          }

          requireAll(
            ["TAURI_SIGNING_PRIVATE_KEY", "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"],
            "Updater signing",
          );
          const windowsSigning = requireAllOrNone(
            ["WINDOWS_CERTIFICATE", "WINDOWS_CERTIFICATE_PASSWORD"],
            "Windows Authenticode signing",
          );
          const appleSigning = requireAllOrNone(
            ["APPLE_CERTIFICATE", "APPLE_CERTIFICATE_PASSWORD"],
            "Apple code signing",
          );
          const appleNotarization = requireAllOrNone(
            ["APPLE_ID", "APPLE_PASSWORD", "APPLE_TEAM_ID"],
            "Apple notarization",
          );
          if (present("APPLE_SIGNING_IDENTITY") && !appleSigning) {
            throw new Error("APPLE_SIGNING_IDENTITY requires Apple code-signing credentials.");
          }
          if (appleNotarization && !appleSigning) {
            throw new Error("Apple notarization requires Apple code-signing credentials.");
          }

          console.log("Updater signing: enabled");
          console.log("Windows Authenticode signing: " + (windowsSigning ? "enabled" : "disabled"));
          console.log("Apple code signing: " + (appleSigning ? "enabled" : "disabled"));
          console.log("Apple notarization: " + (appleNotarization ? "enabled" : "disabled"));
          NODE

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: verify-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact_name: linux-x86_64
            architecture: x86_64
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles appimage,deb,rpm
            artifact_paths: |
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage*
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb*
              target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm*
          - platform: ubuntu-22.04-arm
            artifact_name: linux-aarch64
            architecture: aarch64
            rust_target: aarch64-unknown-linux-gnu
            tauri_args: --target aarch64-unknown-linux-gnu --bundles appimage,deb,rpm
            artifact_paths: |
              target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage*
              target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb*
              target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm*
          - platform: macos-latest
            artifact_name: macos-aarch64
            architecture: aarch64
            rust_target: aarch64-apple-darwin
            tauri_args: --target aarch64-apple-darwin --bundles app,dmg
            updater_archive_name: LumaDesk_aarch64.app.tar.gz
            artifact_paths: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/LumaDesk_aarch64.app.tar.gz*
          - platform: macos-latest
            artifact_name: macos-x86_64
            architecture: x86_64
            rust_target: x86_64-apple-darwin
            tauri_args: --target x86_64-apple-darwin --bundles app,dmg
            updater_archive_name: LumaDesk_x86_64.app.tar.gz
            artifact_paths: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/macos/LumaDesk_x86_64.app.tar.gz*
          - platform: windows-latest
            artifact_name: windows-x86_64
            architecture: x86_64
            rust_target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles nsis
            artifact_paths: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe*
          - platform: windows-latest
            artifact_name: windows-aarch64
            architecture: aarch64
            rust_target: aarch64-pc-windows-msvc
            tauri_args: --target aarch64-pc-windows-msvc --bundles nsis
            artifact_paths: |
              target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe*

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cpio \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact_name }}
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Read application version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare Windows Authenticode signing
        id: windows_signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: scripts/prepare-windows-signing.ps1

      - name: Prepare Apple trust signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
            echo "Apple code signing is enabled."
          else
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "Apple code signing is disabled."
          fi

          if [[ -n "$APPLE_ID" ]]; then
            echo "MACOS_NOTARIZATION_ENABLED=true" >> "$GITHUB_ENV"
            echo "Apple notarization is enabled."
          else
            echo "MACOS_NOTARIZATION_ENABLED=false" >> "$GITHUB_ENV"
            echo "Apple notarization is disabled."
          fi

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.tauri_args }} ${{ steps.windows_signing.outputs.tauri_release_args }}

      - name: Name macOS updater archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          UPDATER_ARCHIVE_NAME: ${{ matrix.updater_archive_name }}
        run: |
          set -euo pipefail
          bundle_directory="target/$RUST_TARGET/release/bundle/macos"
          archive_count="$(find "$bundle_directory" -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')"
          if [[ "$archive_count" -ne 1 ]]; then
            echo "Expected exactly one macOS updater archive, found $archive_count." >&2
            exit 1
          fi

          archive="$(find "$bundle_directory" -maxdepth 1 -type f -name '*.app.tar.gz' -print)"
          [[ -s "$archive.sig" ]] || { echo "Missing updater signature for $archive." >&2; exit 1; }
          mv "$archive" "$bundle_directory/$UPDATER_ARCHIVE_NAME"
          mv "$archive.sig" "$bundle_directory/$UPDATER_ARCHIVE_NAME.sig"

      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/verify-linux-package.sh "${{ matrix.rust_target }}" "${{ matrix.architecture }}" "$APP_VERSION"

      - name: Verify macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          scripts/verify-macos-package.sh
          "${{ matrix.rust_target }}"
          "${{ matrix.architecture }}"
          "$APP_VERSION"
          "$MACOS_SIGNING_ENABLED"
          "$MACOS_NOTARIZATION_ENABLED"

      - name: Verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arguments = @{
            Target = "${{ matrix.rust_target }}"
            Architecture = "${{ matrix.architecture }}"
            Version = $env:APP_VERSION
          }
          if ($env:WINDOWS_SIGNING_ENABLED -eq "true") {
            $arguments.RequireAuthenticode = $true
          }
          & scripts/verify-windows-package.ps1 @arguments

      - name: Store desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble and validate release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download desktop bundles
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Read release identity
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Assemble release files
        run: >-
          node scripts/assemble-release.mjs
          --artifacts release-artifacts
          --output release-files
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --version "$RELEASE_VERSION"

      - name: Validate release files
        run: >-
          node scripts/validate-release.mjs
          --directory release-files
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --version "$RELEASE_VERSION"

      - name: Store release-ready assets
        uses: actions/upload-artifact@v7
        with:
          name: release-ready
          path: release-files
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish verified GitHub release
    needs: assemble
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download release-ready assets
        uses: actions/download-artifact@v8
        with:
          name: release-ready
          path: release-files

      - name: Validate release-ready assets
        run: >-
          node scripts/validate-release.mjs
          --directory release-files
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --version "${GITHUB_REF_NAME#v}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME." >&2
            exit 1
          fi
          mapfile -d '' assets < <(find release-files -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --draft \
            --generate-notes \
            --title "LumaDesk ${GITHUB_REF_NAME#v}" \
            --verify-tag

      - name: Download and revalidate draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir downloaded-release
          gh release download "$GITHUB_REF_NAME" --dir downloaded-release
          node scripts/validate-release.mjs \
            --directory release-files \
            --compare downloaded-release \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "${GITHUB_REF_NAME#v}"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
